# Theme metadata
# Colours taken from the white-throated dipper (Cinclus cinclus):
# dark chocolate head and back, chestnut belly band, white bib.
name = "Dipper"

# Is theme light or dark?
light = true

# Primary (links, buttons, accents) - chestnut belly band
primary = "#8B4A2B"

# Menu bar - dark chocolate head and back
menu_primary = "#3B2A22"
menu_text = "rgba(255,255,255,0.80)"
menu_text_active = "rgba(255,255,255,1)"
menu_title = "#ffffff"

# Backgrounds - white bib, with a warm off-white for alternate sections
background = "#ffffff"
home_section_odd = "#ffffff"
home_section_even = "#F6F2EE"
